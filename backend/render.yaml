services:
  - type: web
    name: windsight-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ELEXON_API_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: CACHE_ENABLED
        value: "true"
      - key: FRONTEND_URL
        value: "*"
